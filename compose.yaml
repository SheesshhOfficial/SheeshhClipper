services:
  clipper:
    build: .
    ports:
      - "127.0.0.1:${SHEESH_PORT:-7310}:8000"
    environment:
      SHEESH_DATA_DIR: /data
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      SHEESH_OLLAMA_URL: ${SHEESH_OLLAMA_URL:-}
      SHEESH_OLLAMA_MODEL: ${SHEESH_OLLAMA_MODEL:-}
    volumes:
      - ./data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
